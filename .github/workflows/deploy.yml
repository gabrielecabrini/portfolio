name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A job-level `permissions` block replaces this one instead of merging with it, so
# every scope the workflow needs is declared here: contents for the gh-pages push,
# packages for the GHCR push.
permissions:
  contents: write
  packages: write

jobs:
  # Runs on pull requests too, so a Dependabot bump can't reach master red.
  verify:
    name: Lint, test and type check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}

    steps:
      - uses: actions/checkout@v4

      # A release is a package.json version with no v<version> tag on origin yet.
      # The tag is pushed only after a successful deploy, so a failed one retries on
      # the next push; commits without a bump (Dependabot included) release nothing.
      - name: Detect new version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then new=false; else new=true; fi
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # Type check only (covers the .astro templates too): the full build, with its
      # Chromium install for the CV PDFs, runs just in the deploy job.
      - name: Type check
        run: yarn astro check

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    # Only on a version bump; a manual run forces a redeploy of the current version.
    if: >-
      github.ref == 'refs/heads/master' &&
      (needs.verify.outputs.new == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: yarn playwright install --with-deps chromium

      - name: Build
        run: yarn build

      # Pushes dist/ to the gh-pages branch, which Pages serves. .nojekyll is
      # required: Jekyll would drop Astro's _astro/ asset folder. --dotfiles too:
      # gh-pages skips them by default, which would drop .well-known/ (WKD).
      - name: Deploy
        run: >-
          yarn gh-pages --silent --dist dist --nojekyll --dotfiles --cname www.gabrielecabrini.it
          --user "Gabriele Cabrini <gabrielecabriniiii@gmail.com>"
          --repo "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pushed with GITHUB_TOKEN, so it doesn't trigger another workflow run.
      - name: Tag release
        if: needs.verify.outputs.new == 'true'
        run: git tag "v$VERSION" && git push origin "v$VERSION"
        env:
          VERSION: ${{ needs.verify.outputs.version }}

  image:
    name: Publish Docker image to GHCR
    needs: verify
    if: github.ref == 'refs/heads/master' && needs.verify.outputs.new == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Needed for the gha cache backend below; the default docker driver can't use it.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` deliberately tracks master, not the newest release tag: it should
          # mirror what gabrielecabrini.it is serving.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}},value=v${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
