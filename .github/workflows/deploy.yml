name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# The site is built here rather than by Cloudflare Workers Builds: the CV PDFs need
# Chromium, whose system libraries only `playwright install --with-deps` can add.
permissions:
  contents: read

jobs:
  # Runs on pull requests too, so a Dependabot bump can't reach master red.
  verify:
    name: Lint, test and type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # Type check only (covers the .astro templates too): the full build, with its
      # Chromium install for the CV PDFs, runs just in the deploy job.
      - name: Type check
        run: yarn astro check

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: yarn playwright install --with-deps chromium

      - name: Build
        run: yarn build

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
