name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# The site is built here rather than by Cloudflare Workers Builds: the CV PDFs need
# Chromium, whose system libraries only `playwright install --with-deps` can add.
permissions:
  contents: read

jobs:
  # Runs on pull requests too, so a Dependabot bump can't reach master red.
  verify:
    name: Lint, test, build and e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Install Chromium for Playwright
        run: yarn playwright install --with-deps chromium

      # astro check + astro build + CV PDFs; the type check covers the .astro templates too.
      - name: Build
        run: yarn build

      - name: E2E
        run: yarn test:e2e

      # The deploy job publishes exactly the dist tested here, without rebuilding it.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master'
        with:
          name: dist
          path: dist/

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'yarn'

      # Only for the pinned wrangler version.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
