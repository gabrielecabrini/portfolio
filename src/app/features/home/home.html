<section class="hero">
  <div class="hero-inner">
    <div class="hero-left">
      <p class="label">{{ 'home.greeting' | translate }}</p>
      <h1>Gabriele Cabrini</h1>
      <p class="subtitle">{{ displayText() }}<span class="cursor" aria-hidden="true">|</span></p>
      <p class="tagline">{{ 'home.tagline' | translate }}</p>
      <div class="cta-row">
        <a routerLink="/experience" class="btn-primary">{{ 'home.cta.experience' | translate }}</a>
        <a routerLink="/about" class="btn-secondary">{{ 'home.cta.about' | translate }}</a>
        <a routerLink="/cv" class="btn-secondary">{{ 'home.cta.cv' | translate }}</a>
      </div>

      <p class="availability">
        <span class="avail-dot" aria-hidden="true"></span>
        {{ 'home.available' | translate
        }}<span class="availability-sep" aria-hidden="true"> | </span
        ><a [href]="email" class="availability-contact">{{ 'home.contact.cta' | translate }}</a>
      </p>
    </div>

    <app-github-activity class="hero-right" />
  </div>
</section>
